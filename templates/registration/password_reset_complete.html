{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Password Changed | PlaceMate AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'Style.css' %}?v=4">
</head>

<body>

<header class="nav">

    <a class="brand" href="/">
        PlaceMate<span>AI</span>
    </a>

    <nav>

        <button
            class="icon-btn"
            id="themeBtn"
            aria-label="Toggle dark mode">
            ◐
        </button>

        <a href="/" class="link">
            Sign in
        </a>

    </nav>

</header>


<main class="stage">

    <section class="card forgot-card">

        <h1>Password Changed!</h1>

        <p class="sub">
            Your password has been successfully changed.
            You can now sign in to your PlaceMate AI account
            using your new password.
        </p>

        <a
            href="/"
            class="primary"
            style="display:block;text-decoration:none;text-align:center;">

            Sign in

        </a>

        <p class="foot">
            Welcome back to <b>PlaceMate AI</b>.
        </p>

    </section>

</main>


<p class="copy">

    © 2026 PlaceMate AI ·

    <a href="#">
        Privacy Policy
    </a>

</p>


<script>

const root = document.documentElement;

try {

    root.dataset.theme =
        localStorage.getItem('pm-theme') || 'light';

} catch (e) {}


const themeBtn =
    document.getElementById('themeBtn');

if (themeBtn) {

    themeBtn.addEventListener('click', () => {

        root.dataset.theme =
            root.dataset.theme === 'dark'
                ? 'light'
                : 'dark';

        try {

            localStorage.setItem(
                'pm-theme',
                root.dataset.theme
            );

        } catch (e) {}

    });

}

</script>

</body>

</html>
